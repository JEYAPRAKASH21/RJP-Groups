<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RJP Construction – Get a Free Quote</title>
  <meta name="description" content="Request a free custom construction quote from RJP Construction. Premium residential & commercial building services." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* DEDICATED QUOTE PAGE - PREMIUM LIGHT THEME */
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 15%, #fef8ee 0%, #fafaf8 60%, #fdf2e3 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* SOFT LIGHT BLENDED BACKGROUND PSEUDO-ELEMENT */
    body::before {
      content: '';
      position: fixed;
      inset: -25px;
      background: url('construction_bg.jpg') center/cover no-repeat;
      opacity: 0.15;
      filter: blur(12px);
      z-index: -1;
      pointer-events: none;
    }

    .quote-hero {
      padding: 120px 24px 60px;
      text-align: center;
      position: relative;
    }

    .q-badge {
      display: inline-block;
      padding: 8px 24px;
      background: rgba(217, 119, 6, 0.1);
      color: #D97706;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      border-radius: 99px;
      text-transform: uppercase;
      margin-bottom: 16px;
      border: 1px solid rgba(217, 119, 6, 0.25);
      box-shadow: 0 4px 15px rgba(217, 119, 6, 0.08);
    }

    .q-title {
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 900;
      color: #1A1A1A;
      line-height: 1.15;
      margin-bottom: 16px;
    }

    .quote-container {
      max-width: 820px;
      margin: 0 auto 100px;
      padding: 0 24px;
      width: 100%;
    }

    .glass-quote-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(217, 119, 6, 0.18);
      border-radius: 32px;
      padding: 48px;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.06), 0 4px 15px rgba(217, 119, 6, 0.05);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .q-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .q-group label {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #D97706;
      text-transform: uppercase;
    }

    .q-group input,
    .q-group select,
    .q-group textarea {
      padding: 14px 18px;
      border: 1.5px solid #DDD;
      border-radius: 12px;
      font-size: 15px;
      font-family: 'Outfit', sans-serif;
      color: #111;
      background: #F8F8F8;
      outline: none;
      transition: all 0.3s ease;
    }

    .q-group input:focus,
    .q-group select:focus,
    .q-group textarea:focus {
      border-color: #D97706;
      box-shadow: 0 0 20px rgba(217, 119, 6, 0.2);
      background: #FFFFFF;
    }

    .q-group select option {
      background: #FFF;
      color: #111;
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .glass-quote-card { padding: 28px; }
    }
  </style>
</head>
<body>

  <!-- TOP SCROLL PROGRESS BAR -->
  <div class="scroll-progress-bar" id="scrollProgressBar"></div>

  <!-- NAVBAR -->
  <nav class="navbar scrolled" id="navbar" style="background: rgba(255, 255, 255, 0.92);">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <span class="nl-r">R</span><span class="nl-j">J</span><span class="nl-p">P</span>
        <span class="nl-group" style="color: var(--text-mid);">GROUP</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html#home" class="nav-link">Home</a></li>
        <li><a href="quote.html" class="nav-link active">Construction Quote</a></li>
        <li><a href="vehicles.html" class="nav-link">Travels Fleet</a></li>
        <li><a href="csc.html" class="nav-link">CSC Center</a></li>
        <li><a href="index.html#contact" class="nav-link">Contact</a></li>
      </ul>
      <a href="index.html#home" class="btn-outline" style="padding: 8px 20px; font-size: 13px;">← Back to Home</a>
    </div>
  </nav>

  <!-- HERO SECTION -->
  <section class="quote-hero">
    <div class="q-badge">RJP CONSTRUCTION QUOTE</div>
    <h1 class="q-title">Get Your Free <span style="background: linear-gradient(135deg, #D97706, #F59E0B); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Construction Estimate</span></h1>
  </section>

  <!-- QUOTE FORM CONTAINER -->
  <div class="quote-container">
    <div class="glass-quote-card">
      <form onsubmit="handleQuoteSubmit(event)">
        <div class="form-grid">

          <div class="q-group">
            <label>Full Name</label>
            <input type="text" id="qName" placeholder="Enter your full name" required />
          </div>

          <div class="q-group">
            <label>Mobile / WhatsApp Number</label>
            <input type="tel" id="qPhone" placeholder="+91 XXXXX XXXXX" required />
          </div>

          <div class="q-group">
            <label>Project Category</label>
            <select id="qCategory" required>
              <option value="">Select Project Type</option>
              <option value="Luxury Residential Villa">Luxury Residential Villa</option>
              <option value="Commercial Tower / Complex">Commercial Tower / Complex</option>
              <option value="Building Renovation & Upgrade">Building Renovation & Upgrade</option>
              <option value="Architectural & Structural Design">Architectural & Structural Design</option>
              <option value="Interior & Glass Facade Finish">Interior & Glass Facade Finish</option>
            </select>
          </div>

          <div class="q-group">
            <label>Estimated Budget Range</label>
            <select id="qBudget" required>
              <option value="">Select Budget Range</option>
              <option value="₹20 Lakhs – ₹50 Lakhs">₹20 Lakhs – ₹50 Lakhs</option>
              <option value="₹50 Lakhs – ₹1 Crore">₹50 Lakhs – ₹1 Crore</option>
              <option value="₹1 Crore – ₹5 Crores">₹1 Crore – ₹5 Crores</option>
              <option value="₹5 Crores+">₹5 Crores+</option>
            </select>
          </div>

          <div class="q-group full-width">
            <label>Property / Site Location</label>
            <input type="text" id="qLocation" placeholder="City, Area or Site Address" required />
          </div>

          <div class="q-group full-width">
            <label>Project Requirements / Details</label>
            <textarea id="qDetails" rows="4" placeholder="Tell us about your plot size, number of floors, timeline, or design preferences..."></textarea>
          </div>

        </div>

        <button type="submit" class="btn-primary btn-gold-shine btn-full pulse-glow" id="submitQuoteBtn" style="margin-top: 28px; padding: 18px; font-size: 16px; font-weight: 800;">
          Request Free Construction Quote 🏗️
        </button>
      </form>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">
        <span class="fl-r">R</span><span class="fl-j">J</span><span class="fl-p">P</span>
        <span class="fl-group">GROUP</span>
      </div>
      <p class="footer-tagline">RJP Construction Luxury Engineering</p>
      <p class="footer-copy">© 2026 RJP Group. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- FLOATING WHATSAPP BUTTON -->
  <a href="https://wa.me/917358656647?text=Hello%20RJP%20Construction,%20I%20have%20an%20inquiry." target="_blank" class="floating-whatsapp-btn" aria-label="Chat on WhatsApp" title="Chat on WhatsApp">💬</a>

  <script>
    function handleQuoteSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('qName').value.trim();
      const phone = document.getElementById('qPhone').value.trim();
      const category = document.getElementById('qCategory').value;
      const budget = document.getElementById('qBudget').value;
      const location = document.getElementById('qLocation').value.trim();
      const details = document.getElementById('qDetails').value.trim();

      const msg = `*RJP Construction - Quote Inquiry*\n\n` +
                  `👤 *Name:* ${name}\n` +
                  `📞 *Mobile:* ${phone}\n` +
                  `🏗️ *Project Category:* ${category}\n` +
                  `💰 *Budget Range:* ${budget}\n` +
                  `📍 *Site Location:* ${location}\n` +
                  `📝 *Details:* ${details || 'N/A'}`;

      const url = `https://wa.me/917358656647?text=${encodeURIComponent(msg)}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
